# MISE_ENV=integ — équivalent de l'ancien .env.integ
[env]
INTEGRATION = "true"
KEYCLOAK_PROTOCOL = "https"
# Renseigner pour cibler l'environnement d'intégration.
KEYCLOAK_DOMAIN = { required = "Domaine du Keycloak d'intégration (ex: keycloak.dso.example.fr)" }
KEYCLOAK_REALM = { required = "Royaume Keycloak de l'environnement d'intégration" }
KEYCLOAK_CLIENT_ID = { required = "Client Keycloak frontend de l'environnement d'intégration" }
