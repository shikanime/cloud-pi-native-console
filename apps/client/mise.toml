[env]
SERVER_HOST = "localhost"
SERVER_PORT = "4000"
KEYCLOAK_DOMAIN = "localhost:8090"
KEYCLOAK_CLIENT_ID = "dso-console-frontend"
OPENCDS_ENABLED = "false"

[tasks.build]
description = "Build le client"
run = "pnpm run build"

[tasks.dev]
description = "Lance le client en développement"
run = "pnpm run dev"
