[env]
DEV_SETUP = "true"
SERVER_HOST = "localhost"
SERVER_PORT = "3001"
KEYCLOAK_DOMAIN = "localhost:8090"
KEYCLOAK_CLIENT_ID = "dso-console-backend"
KEYCLOAK_ADMIN_CLIENT_ID = "admin-cli"
KEYCLOAK_JWKS_CACHE_TTL_MS = "300000"
KEYCLOAK_JWKS_TIMEOUT_MS = "1000"
USE_ARGOCD = "false"
USE_GITLAB = "false"
USE_NEXUS = "false"
USE_HARBOR = "false"
USE_SONARQUBE = "false"
USE_VAULT = "false"
USE_OBSERVABILITY = "false"
GRAFANA_URL = "https://grafana.example.com"
DSO_OBSERVABILITY_CHART_VERSION = "dso-observability-0.1.7"

[tasks.build]
description = "Build le serveur NestJS"
run = "pnpm run build"
